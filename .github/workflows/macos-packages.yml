name: macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AUTO_SIGN: 'false'
  SKIP_SIGN: 'true'
  SKIP_NOTARIZE: 'true'

jobs:
  package:
    name: Unsigned packages (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            architecture: arm64
          - runner: macos-15-intel
            rid: osx-x64
            architecture: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Verify native runner
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          sw_vers
      - name: Restore pinned Eto dependency
        run: bash scripts/macos/bootstrap.sh
      - name: Build unsigned packages
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          export ETO_DIR="$PWD/.deps/Eto"
          bash Keysharp.Install/package-macos.sh
      - name: Hash package artifacts
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          packages = sorted(Path('dist').glob('*.pkg')) + sorted(Path('dist').glob('*.dmg'))
          if len(packages) != 2:
              raise SystemExit(f'Expected one PKG and one DMG, got {len(packages)} files')
          hashes = [f'{hashlib.file_digest(path.open("rb"), "sha256").hexdigest()}  {path.name}' for path in packages]
          Path('dist/SHA256SUMS').write_text('\n'.join(hashes) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-keysharp-${{ matrix.rid }}
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
